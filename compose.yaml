services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realy
      POSTGRES_PASSWORD: realy
      POSTGRES_DB: realy
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realy -d realy"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - realy-postgres:/var/lib/postgresql/data

volumes:
  realy-postgres:
