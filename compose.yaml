name: relay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: relay
    ports:
      - "127.0.0.1:${RELAY_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - relay-postgres:/var/lib/postgresql/data

  relay-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${RELAY_VERSION:-dev}
    image: relay-server:${RELAY_VERSION:-local}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/relay?sslmode=disable
      RELAY_ARTIFACT_BACKEND: file
      RELAY_ARTIFACT_ROOT: /var/lib/relay/artifacts
      RELAY_HOST_TOKEN: ${RELAY_HOST_TOKEN:?set RELAY_HOST_TOKEN in .env}
      RELAY_NODE_TOKEN: ${RELAY_NODE_TOKEN:?set RELAY_NODE_TOKEN in .env}
      RELAY_TENANT_ID: ${RELAY_TENANT_ID:-default}
      RELAY_PROJECT_ID: ${RELAY_PROJECT_ID:-default}
    ports:
      - "${RELAY_BIND_ADDRESS:-0.0.0.0}:${RELAY_SERVER_PORT:-8787}:8787"
    volumes:
      - relay-artifacts:/var/lib/relay/artifacts
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    stop_grace_period: 30s

volumes:
  relay-postgres:
  relay-artifacts:
